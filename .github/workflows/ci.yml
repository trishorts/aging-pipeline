# CI for aging-pipeline. Two jobs, following the mzLib / pyMzLib convention:
#
#   offline  Every test NOT marked `network`: the stage scripts end to end on synthetic inputs, with PRIDE,
#            the .raw reader and MetaMorpheus faked (tests/fake_metamorpheus.py). No network. On all three
#            OSes, because operators run Linux and development is on Windows.
#
#   live     Only the `network` tests: real PRIDE and UniProt calls. When a service is DOWN (a timeout, a
#            refused connection, HTTP 408/429/5xx), the test SKIPS with its reason printed (-rs); a
#            third-party outage is not a code failure. Any other error FAILS: a changed response or a
#            wrong answer means the contract broke. So there is deliberately no continue-on-error.
#            Keep this job OUT of the required branch-protection checks, as mzLib does. It also runs
#            weekly, to catch drift in the services while nobody is pushing.
#
#   search   A REAL MetaMorpheus 1.1.11 search on Linux, launched as `dotnet CMD.dll`: stages 0 → 2b → 4 on
#            two sliced Thermo .raw files from mzLib's test data, pinned to one mzLib commit
#            (tests/test_real_search.py). The release zip and the files are cached. Running it accepts
#            Thermo's RawFileReader licence, as every pipeline run on .raw input does.
#
# Not tested here yet: main.nf (never run; see README "Status and known limitations").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC: live canaries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0               # provenance records the git commit; give it real history
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Offline tests
        run: python -m pytest -m "not network" -v -rs

  live:
    name: live canaries (PRIDE, UniProt)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Live tests (an outage skips; a contract break fails)
        run: python -m pytest -m network -v -rs

  search:
    name: real search (MetaMorpheus 1.1.11, Linux, dotnet CMD.dll)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MM_RELEASE: "1.1.11"           # aging D12: the pinned release; change it only together with params
      MZLIB_DATA: https://raw.githubusercontent.com/smith-chem-wisc/mzLib/7c52249aa8ec9f5bbfab8afeeda7bdee7859e8a3/mzLib/Test/FlashLFQ/TestData
      DATA_FILES: f1r1_sliced_mbr.raw f1r2_sliced_mbr.raw UP000005640_reviewedproteinPruned.xml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"   # MetaMorpheus 1.1.11 targets net10.0
      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            ~/metamorpheus
            ~/mmdata
          key: mm-${{ env.MM_RELEASE }}-mzlib-7c52249
      - name: Download MetaMorpheus and the test data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o mm.zip \
            "https://github.com/smith-chem-wisc/MetaMorpheus/releases/download/$MM_RELEASE/MetaMorpheus_CommandLine.zip"
          unzip -q mm.zip -d ~/metamorpheus && rm mm.zip
          mkdir -p ~/mmdata
          for f in $DATA_FILES; do curl -fsSL --retry 3 -o ~/mmdata/$f "$MZLIB_DATA/$f"; done
      - name: Point the test at them
        run: |
          set -euo pipefail
          cmd=$(find ~/metamorpheus -name CMD.dll | head -n1)
          test -n "$cmd" || { echo "CMD.dll not found in the release zip"; exit 1; }
          for f in $DATA_FILES; do test -s ~/mmdata/$f; done
          echo "AGING_MM_CMD=$cmd" >> "$GITHUB_ENV"
          echo "AGING_MM_DATA=$HOME/mmdata" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Real search (a skip here is a failure)
        run: |
          set -o pipefail
          python -m pytest -m metamorpheus -v -rs -s | tee pytest.log
          grep -q "1 passed" pytest.log
      - name: Keep the run's outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-search
          path: /tmp/pytest-of-*/pytest-*/test_real_search*/run_*/PXD000000/04_search/*.json
          if-no-files-found: ignore
