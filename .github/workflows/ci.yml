# CI for aging-pipeline. Two jobs, following the mzLib / pyMzLib convention:
#
#   offline  Every test NOT marked `network`: the stage scripts end to end on synthetic inputs, with PRIDE,
#            the .raw reader and MetaMorpheus faked (tests/fake_metamorpheus.py). No network. On all three
#            OSes, because operators run Linux and development is on Windows.
#
#   live     Only the `network` tests: real PRIDE and UniProt calls. When a service is DOWN (a timeout, a
#            refused connection, HTTP 408/429/5xx), the test SKIPS with its reason printed (-rs); a
#            third-party outage is not a code failure. Any other error FAILS: a changed response or a
#            wrong answer means the contract broke. So there is deliberately no continue-on-error.
#            Keep this job OUT of the required branch-protection checks, as mzLib does. It also runs
#            weekly, to catch drift in the services while nobody is pushing.
#
# Not tested here yet: a real MetaMorpheus search (needs the 1.1.11 CLI and a .raw file on Linux) and
# main.nf (never run; see README "Status and known limitations").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC: live canaries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # provenance records the git commit; give it real history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Offline tests
        run: python -m pytest -m "not network" -v -rs

  live:
    name: live canaries (PRIDE, UniProt)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Live tests (an outage skips; a contract break fails)
        run: python -m pytest -m network -v -rs
